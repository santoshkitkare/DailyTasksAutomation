[project]
name = "daily-ai-automation"
version = "0.1.0"
description = "Daily AI Supervisor for Gmail triage and birthday/anniversary greeting automation"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "google-api-python-client>=2.140",
    "google-auth>=2.33",
    "google-auth-oauthlib>=1.2",
    "google-genai>=0.3",
    "openpyxl>=3.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
]

[project.scripts]
daily-automation = "daily_ai_automation.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["daily_ai_automation*"]

[tool.setuptools.package-data]
daily_ai_automation = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external APIs; deselected by default (run with -m live)",
]
addopts = "-m 'not live'"
